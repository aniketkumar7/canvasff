# Render worker: triggered by the Render API (workflow_dispatch), renders one Short, posts it back.
# Repo secrets: API_URL (Render URL, no trailing slash), WORKER_TOKEN (same as on Render)
name: render
run-name: render ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # -eo pipefail: a failed render isn't hidden by `| tee`
    env:
      API: ${{ secrets.API_URL }}/jobs/${{ inputs.job_id }}
      CURL: curl -fsS --retry 5 --retry-all-errors --retry-delay 10  # Render free can be slow to wake
    steps:
      - name: Mark rendering
        env: { TOKEN: "${{ secrets.WORKER_TOKEN }}" }
        run: |
          $CURL -X POST -H "X-Worker-Token: $TOKEN" -F status=rendering "$API/status"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker-requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # cached between runs: static ffmpeg + emoji font (no apt), editor node_modules (incl. Remotion's Chrome)
      - id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/tools
            ~/.local/share/fonts
          key: tools-ffmpeg7-noto-v1

      - id: nm
        uses: actions/cache@v4
        with:
          path: editor/node_modules
          key: nm-${{ hashFiles('editor/package-lock.json') }}

      # photo shot models (rembg BiRefNet-lite cut-out + Depth Anything V2 Small): download once, not per render.
      # rembg 2.x keeps its models in ~/.rembg; ~/.u2net was the older location
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rembg
            ~/.u2net
            ~/.cache/huggingface
          key: photo-models-v2

      - name: Install deps
        run: |
          if [ "${{ steps.tools.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/tools ~/.local/share/fonts
            curl -fsSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              | tar xJ --strip-components=1 -C ~/tools --wildcards '*/ffmpeg' '*/ffprobe'
            curl -fsSL -o ~/.local/share/fonts/NotoColorEmoji.ttf \
              https://github.com/googlefonts/noto-emoji/raw/main/2D/fonts/NotoColorEmoji.ttf
          fi
          echo ~/tools >> "$GITHUB_PATH"
          fc-cache -f ~/.local/share/fonts
          pip install -q -r worker-requirements.txt
          [ "${{ steps.nm.outputs.cache-hit }}" = "true" ] || npm ci --prefix editor --no-audit --no-fund

      - name: Download job
        env: { TOKEN: "${{ secrets.WORKER_TOKEN }}" }
        run: |
          $CURL -H "X-Worker-Token: $TOKEN" "$API/input.zip" -o input.zip
          unzip -q input.zip -d job

      - name: Render
        run: |
          # Remotion defaults to half the CPUs (1 of 2 here); use all of them
          RENDER_FLAGS="--concurrency=$(nproc)" python make_short.py --job job 2>&1 | tee render.log

      - name: Upload result
        env: { TOKEN: "${{ secrets.WORKER_TOKEN }}" }
        run: |
          $CURL -X POST -H "X-Worker-Token: $TOKEN" -F video=@job/out.mp4 -F "meta=<job/out.json" "$API/result"

      - name: Report failure
        if: failure()
        env:
          TOKEN: ${{ secrets.WORKER_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $CURL -X POST -H "X-Worker-Token: $TOKEN" -F status=error \
            --form-string "error=Render failed. Log: $RUN" \
            --form-string "log=$(tail -c 1500 render.log 2>/dev/null)" "$API/status"

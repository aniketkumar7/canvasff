# Render blueprint for the API (free plan). Set the sync:false values in the Render dashboard.
services:
  - type: web
    name: canvasff-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GH_REPO
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: WORKER_TOKEN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
